name: CI/CD Pipeline for Ju Keramia

on:
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]

jobs:
  # This CI covers linting, type-checking, build, security, and ceramic-specific validations

  # Linting
  lint:
    runs-on: ubuntu-latest
    name: Code Linting

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Linting Report
        run: echo "Code linting passed!"

  # TypeScript Type Checking
  type-check:
    runs-on: ubuntu-latest
    name: TypeScript Type Checking

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Report Type Safety
        run: echo "TypeScript type checking passed!"

  # Build Test
  build:
    runs-on: ubuntu-latest
    name: Build Application

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          # Provide test environment variables for build
          NUXT_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test_key' }}
          NUXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ secrets.HCAPTCHA_SITE_KEY || 'test_site_key' }}
          NUXT_HCAPTCHA_SECRET_KEY: ${{ secrets.HCAPTCHA_SECRET_KEY || 'test_secret_key' }}

      - name: Build Report
        run: echo "Application built successfully!"

  # Security Audit
  security-audit:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Security Audit
        run: npm audit --audit-level=moderate

      - name: Security Report
        run: echo "Security audit completed!"

  # Ceramic Design System Validation
  design-system-check:
    runs-on: ubuntu-latest
    name: Ceramic Design System Validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Ceramic Design Tokens
        run: |
          echo "Checking ceramic design system consistency..."

          # Check if ceramic CSS variables are properly defined
          if grep -q "color-clay-" app/assets/css/main.css; then
            echo "Clay color tokens found"
          else
            echo "Clay color tokens missing" && exit 1
          fi

          if grep -q "color-sage-" app/assets/css/main.css; then
            echo "Sage color tokens found"
          else
            echo "Sage color tokens missing" && exit 1
          fi

          if grep -q "spacing-ceramic-" app/assets/css/main.css; then
            echo "Ceramic spacing tokens found"
          else
            echo "Ceramic spacing tokens missing" && exit 1
          fi

          echo "Ceramic design system validation passed!"

  # Contact Form Validation Test
  contact-form-test:
    runs-on: ubuntu-latest
    name: Contact Form Validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Contact Form Security
        run: |
          echo "Checking contact form security implementation..."

          # Check if form validation is implemented (supports both manual and Nuxt UI patterns)
          if grep -q ':schema="schema"' app/pages/contact/index.vue || grep -q "schema.parse(form.value)" app/pages/contact/index.vue; then
            echo "Form validation implementation found"
          else
            echo "Form validation missing - security risk!" && exit 1
          fi

          # Check if validation schema is imported (either directly or via composable)
          if grep -q "useContactFormValidation" app/pages/contact/index.vue || grep -q "contactFormSchema" app/pages/contact/index.vue; then
            echo "Validation schema/composable imported"
          else
            echo "Validation schema not imported" && exit 1
          fi

          # Check if hCaptcha integration exists
          if grep -q "initializeCaptcha" app/pages/contact/index.vue || grep -q "useCaptcha" app/pages/contact/index.vue || grep -q "h-captcha-container" app/pages/contact/index.vue; then
            echo "hCaptcha integration found"
          else
            echo "hCaptcha integration missing" && exit 1
          fi

          echo "Contact form security validation passed!"

  # Sync to Owner Repository (triggers Vercel deployment)
  sync-to-owner:
    runs-on: ubuntu-latest
    name: Sync to Owner Repository
    needs: [lint, type-check, build, security-audit, design-system-check, contact-form-test]
    # Only synchronize a validated push to the development main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Check out exactly the pushed main commit, so the push below mirrors the tested commit
          ref: ${{ github.sha }}
          fetch-depth: 0 # Fetch all history for proper sync

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Setup SSH Key
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push to Owner Repository
        run: |
          # Add owner remote with SSH
          if ! git remote | grep -q "owner"; then
            git remote add owner git@github.com:jukeramia/ju_keramia.git
          fi

          # Configure git to use SSH key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes"

          # Push to owner repository (triggers Vercel deployment)
          # Fast-forward-only push of the checked-out commit: no local main branch is required,
          # and a diverged owner main is rejected instead of being overwritten.
          git push owner HEAD:refs/heads/main

          echo "Successfully synced to owner repository!"
          echo "Vercel deployment should trigger automatically"
